<script>
(function(){
  var pageView=document.getElementById('page');
  var canvas=document.getElementById('canvas');
  var readout=document.getElementById('zoom-readout');
  var hint=document.getElementById('hint');
  var cols=[].slice.call(document.querySelectorAll('.page-fit'));
  var stages=[].slice.call(document.querySelectorAll('.stage'));
  var tabs=[].slice.call(document.querySelectorAll('[data-page-tab]'));
  var views=[].slice.call(document.querySelectorAll('[data-view]'));
  var current=0,view='page';
  var MIN=0.1,MAX=2,PAD=40,CONTROLS=64;
  var z=1,x=0,y=0,moved=false,drag=null;

  // Page view: scale each page column down to the available width.
  function fitPage(){
    var fit=cols[current];if(!fit)return;
    var col=fit.firstElementChild;
    var w=Number(fit.dataset.width),h=Number(fit.dataset.height);
    var style=getComputedStyle(pageView);
    var avail=pageView.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
    var s=Math.min(1,Math.max(0.05,avail/w));
    col.style.width=w+'px';col.style.transform='scale('+s+')';
    fit.style.width=Math.round(w*s)+'px';fit.style.height=Math.round(h*s)+'px';
  }

  // Canvas view: pan and zoom like the editor.
  function stage(){return stages[current];}
  function apply(){
    if(!stage())return;
    stage().style.transform='translate('+x+'px,'+y+'px) scale('+z+')';
    readout.textContent=Math.round(z*100)+'%';
  }
  function fitCanvas(){
    var r=canvas.getBoundingClientRect(),st=stage();
    if(!st||!r.width||!r.height)return;
    var W=Number(st.dataset.width),H=Number(st.dataset.height);
    z=Math.max(MIN,Math.min(1,(r.width-PAD*2)/W,(r.height-PAD*2-CONTROLS)/H));
    x=(r.width-W*z)/2;y=Math.max(PAD,(r.height-CONTROLS-H*z)/2);
    moved=false;apply();
  }
  function zoomAt(next,cx,cy){
    next=Math.min(MAX,Math.max(MIN,next));
    x=cx-(cx-x)*(next/z);y=cy-(cy-y)*(next/z);z=next;moved=true;apply();
  }
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=canvas.getBoundingClientRect();
    // Clamp so one mouse-wheel notch zooms gently; trackpad pinch deltas are small anyway.
    if(e.ctrlKey||e.metaKey){zoomAt(z*Math.exp(-Math.max(-25,Math.min(25,e.deltaY))*0.01),e.clientX-r.left,e.clientY-r.top);}
    else{x-=e.deltaX;y-=e.deltaY;moved=true;apply();}
  },{passive:false});
  canvas.addEventListener('pointerdown',function(e){
    if(e.button!==0||e.target.closest('.controls'))return;
    drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:x,y:y};
    canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',function(e){
    if(!drag||drag.id!==e.pointerId)return;
    x=drag.x+e.clientX-drag.sx;y=drag.y+e.clientY-drag.sy;moved=true;apply();
  });

  canvas.addEventListener('pointerup',endDrag);
  canvas.addEventListener('pointercancel',endDrag);

      var r=canvas.getBoundingClientRect(),a=button.getAttribute('data-zoom');
      if(a==='in')zoomAt(z*1.25,r.width/2,r.height/2);
      else if(a==='out')zoomAt(z*0.8,r.width/2,r.height/2);
      else fitCanvas();
    });
  });

  function render(){
    pageView.hidden=view!=='page';canvas.hidden=view!=='canvas';
    if(hint)hint.hidden=view!=='canvas';
    cols.forEach(function(c,i){c.hidden=i!==current;});
    stages.forEach(function(st,i){st.hidden=i!==current;});
    tabs.forEach(function(t,i){if(i===current)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});

    });
  });
  views.forEach(function(b){
    b.addEventListener('click',function(){view=b.getAttribute('data-view');render();});
  });
  window.addEventListener('resize',function(){if(view==='page')fitPage();else if(!moved)fitCanvas();});
  var m=/^#page-(d+)$/.exec(location.hash);
  if(m&&cols[Number(m[1])-1])current=Number(m[1])-1;
  render();
})();
